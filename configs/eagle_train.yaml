extends: base.yaml

drafter:
  kind: eagle
  # One full-width Qwen2 decoder layer, faithful to the paper (51.5M params).
  # The MLP is 41.3M of that, so `intermediate_size: 4096` is the size lever if
  # Phase 5 shows drafter latency eating the speedup.
  hidden_size: 1536
  intermediate_size: 8960
  num_attention_heads: 12
  num_key_value_heads: 2

train:
  seq_len: 1024
  batch_size: 1
  grad_accum: 16
  lr: 3.0e-4
  weight_decay: 0.0
  warmup_steps: 100
  schedule: cosine
  grad_clip: 1.0
  amp_dtype: float16
  ce_chunk_size: 256
  loss:
    # Weighting is set empirically from Phase 2 feature statistics rather than
    # pinned from memory -- see docs/plan.md open question 3.
    w_regression: TBD
    w_cross_entropy: 1.0
