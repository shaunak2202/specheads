extends: base.yaml

drafter:
  kind: eagle
  # One full-width Qwen2 decoder layer, faithful to the paper (51.5M params).
  # The MLP is 41.3M of that, so `intermediate_size: 4096` is the size lever if
  # Phase 5 shows drafter latency eating the speedup.
  hidden_size: 1536
  intermediate_size: 8960
  num_attention_heads: 12
  num_key_value_heads: 2

train:
  seq_len: 1024
  batch_size: 1
  grad_accum: 16
  lr: 3.0e-4
  weight_decay: 0.0
  warmup_steps: 100
  schedule: cosine
  grad_clip: 1.0
  amp_dtype: float16
  ce_chunk_size: 256
  loss:
    # Open question 3, resolved: chosen empirically, not pinned from memory.
    # Phase 5 sweeps w_cross_entropy over `sweep_values` -- same data slice, same
    # step count, same seed for each -- and selects on mean accepted length on
    # the held-out validation split (never the eval prompts). The sweep table is
    # committed before the full drafter is trained.
    w_regression: 1.0
    w_cross_entropy: TBD        # filled in from results/eagle_loss_sweep/
    sweep_values: [0.03, 0.1, 0.3, 1.0]
    select_on: mean_accepted_length
    select_split: validation
