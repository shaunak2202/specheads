extends: base.yaml

drafter:
  kind: medusa
  # Train 5, evaluate depth 1-5: heads are independent and cost ~2.36M each, so
  # the 5th is cheap insurance that widens the Phase 6 tree sweep without a retrain.
  num_heads: 5
  num_resblocks: 1
  head_loss_decay: 0.8       # lambda_k = 0.8^k

train:
  seq_len: 1024
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 100
  schedule: cosine
  grad_clip: 1.0
  amp_dtype: float16         # fp32 master weights, fp16 autocast
  # Logits dominate memory at vocab 151936 (622 MB per fp32 1024-token set, x K).
  # Chunking the CE over the sequence caps peak logit memory by the chunk ratio.
  ce_chunk_size: 256
